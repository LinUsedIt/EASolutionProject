<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="1056" viewBox="0 0 1170 1056" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs>
<rect width="1170" height="1056" fill="white"/>
<text x="40" y="38" font-size="20" font-weight="600" fill="#1f2937">Mentor Change: Baseline (current state)</text>
<text x="40" y="62" font-size="13" fill="#4b5563">An email relay between student, OSM, coordinator and mentors; about 2 days per request</text>
<rect x="40" y="80" width="240" height="892" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="160.0" y="101" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Student</text>
<rect x="280" y="80" width="240" height="892" fill="white" stroke="#d1d5db"/>
<text x="400.0" y="101" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Office of Student Mentoring</text>
<rect x="520" y="80" width="240" height="892" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="640.0" y="101" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">School Mentoring Coordinator</text>
<rect x="760" y="80" width="240" height="892" fill="white" stroke="#d1d5db"/>
<text x="880.0" y="101" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Mentor</text>
<rect x="60.0" y="140.0" width="200" height="64" rx="32" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="160.0" y="168.0" text-anchor="middle" font-size="12" fill="#1f2937">Student wants</text>
<text x="160.0" y="184.0" text-anchor="middle" font-size="12" fill="#1f2937">a different mentor</text>
<rect x="60.0" y="244.0" width="200" height="64" rx="8" fill="white" stroke="#6b7280" stroke-width="1.25"/>
<text x="160.0" y="272.0" text-anchor="middle" font-size="12" fill="#1f2937">Emails OSM or the</text>
<text x="160.0" y="288.0" text-anchor="middle" font-size="12" fill="#1f2937">coordinator</text>
<rect x="300.0" y="348.0" width="200" height="64" rx="8" fill="white" stroke="#6b7280" stroke-width="1.25"/>
<text x="400.0" y="368.0" text-anchor="middle" font-size="12" fill="#1f2937">Relays request to</text>
<text x="400.0" y="384.0" text-anchor="middle" font-size="12" fill="#1f2937">school coordinator</text>
<text x="400.0" y="400.0" text-anchor="middle" font-size="12" fill="#1f2937">(email)</text>
<rect x="540.0" y="452.0" width="200" height="64" rx="8" fill="white" stroke="#6b7280" stroke-width="1.25"/>
<text x="640.0" y="472.0" text-anchor="middle" font-size="12" fill="#1f2937">Asks for preferred mentor;</text>
<text x="640.0" y="488.0" text-anchor="middle" font-size="12" fill="#1f2937">if none, sends a list</text>
<text x="640.0" y="504.0" text-anchor="middle" font-size="12" fill="#1f2937">of possible mentors</text>
<rect x="540.0" y="556.0" width="200" height="64" rx="8" fill="white" stroke="#6b7280" stroke-width="1.25"/>
<text x="640.0" y="576.0" text-anchor="middle" font-size="12" fill="#1f2937">Emails candidate mentor:</text>
<text x="640.0" y="592.0" text-anchor="middle" font-size="12" fill="#1f2937">willing to take</text>
<text x="640.0" y="608.0" text-anchor="middle" font-size="12" fill="#1f2937">this mentee?</text>
<polygon points="780.0,692.0 880.0,654.0 980.0,692.0 880.0,730.0" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="880.0" y="696.0" text-anchor="middle" font-size="12" fill="#1f2937">Mentor accepts?</text>
<rect x="540.0" y="764.0" width="200" height="64" rx="8" fill="white" stroke="#6b7280" stroke-width="1.25"/>
<text x="640.0" y="792.0" text-anchor="middle" font-size="12" fill="#1f2937">Sends updated mentee list,</text>
<text x="640.0" y="808.0" text-anchor="middle" font-size="12" fill="#1f2937">CC OSM</text>
<rect x="60.0" y="868.0" width="200" height="64" rx="32" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="160.0" y="896.0" text-anchor="middle" font-size="12" fill="#1f2937">Student told of</text>
<text x="160.0" y="912.0" text-anchor="middle" font-size="12" fill="#1f2937">new mentor (email)</text>
<path d="M160.0 204.0V244.0" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M160.0 308.0V334.0H400.0V348.0" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M400.0 412.0V438.0H640.0V452.0" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M640.0 516.0V556.0" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M640.0 620.0V640.0H880.0V654.0" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M640.0 828.0V854.0H160.0V868.0" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M980.0 692.0H996.0V588.0H740.0" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a)"/>
<text x="1000.0" y="640.0" text-anchor="start" font-size="11" font-style="italic" fill="#4b5563">no: try another mentor</text>
<path d="M880.0 730.0V750.0H640.0V764.0" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a)"/>
<text x="760.0" y="745.0" text-anchor="middle" font-size="11" font-style="italic" fill="#4b5563">yes</text>
<text x="40" y="1012" font-size="12" fill="#4b5563">Mentors can also trigger changes (e.g. mentees who never reply). Mostly freshmen requests.</text>
<text x="40" y="1034" font-size="12" fill="#4b5563">Sources: Interview with OSM (2026-09-28); Interview with SSE Mentoring Coordinator (2026-10-16); Interview with SED Mentoring Coordinator (2026-10-20).</text>
</svg>