<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" font-family="Segoe UI, Arial, Liberation Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker></defs>
<rect width="1440" height="760" fill="white"/>
<text x="40" y="38" font-size="20" font-weight="600" fill="#1f2937">C2. Application Communication Diagram (Baseline)</text>
<text x="40" y="62" font-size="13" fill="#4b5563">Only session logging is automated; the rest of the work moves by email and by hand</text>
<line x1="285.0" y1="190.0" x2="495.0" y2="190.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="390.0" y="168.0" text-anchor="middle" font-size="11.5" fill="#4b5563" paint-order="stroke" stroke="white" stroke-width="4">Student list, sent to OSM</text>
<text x="390.0" y="182.0" text-anchor="middle" font-size="11.5" fill="#4b5563" paint-order="stroke" stroke="white" stroke-width="4">or to a coordinator (two routes)</text>
<line x1="745.0" y1="190.0" x2="935.0" y2="190.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="840.0" y="168.0" text-anchor="middle" font-size="11.5" fill="#4b5563" paint-order="stroke" stroke="white" stroke-width="4">List in; pairings and</text>
<text x="840.0" y="182.0" text-anchor="middle" font-size="11.5" fill="#4b5563" paint-order="stroke" stroke="white" stroke-width="4">capacity replies out</text>
<line x1="1060.0" y1="352.0" x2="1060.0" y2="228.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="980.0" y="294.0" text-anchor="middle" font-size="11.5" fill="#4b5563" paint-order="stroke" stroke="white" stroke-width="4">Answers copied by hand</text>
<line x1="665.2" y1="228.0" x2="1014.8" y2="522.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="780.0" y="385.0" text-anchor="middle" font-size="11.5" fill="#4b5563" paint-order="stroke" stroke="white" stroke-width="4">OSM updates pairings</text>
<text x="780.0" y="399.0" text-anchor="middle" font-size="11.5" fill="#4b5563" paint-order="stroke" stroke="white" stroke-width="4">by hand</text>
<line x1="285.0" y1="560.0" x2="495.0" y2="560.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
<text x="390.0" y="550.0" text-anchor="middle" font-size="11.5" fill="#4b5563" paint-order="stroke" stroke="white" stroke-width="4">Student submits a session</text>
<line x1="620.0" y1="522.0" x2="620.0" y2="228.0" stroke="#6b7280" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="540.0" y="375.0" text-anchor="middle" font-size="11.5" fill="#4b5563" paint-order="stroke" stroke="white" stroke-width="4">Confirm link to mentor;</text>
<text x="540.0" y="389.0" text-anchor="middle" font-size="11.5" fill="#4b5563" paint-order="stroke" stroke="white" stroke-width="4">mentor's answer</text>
<line x1="745.0" y1="560.0" x2="935.0" y2="560.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
<text x="840.0" y="538.0" text-anchor="middle" font-size="11.5" fill="#4b5563" paint-order="stroke" stroke="white" stroke-width="4">Updates the log and the</text>
<text x="840.0" y="552.0" text-anchor="middle" font-size="11.5" fill="#4b5563" paint-order="stroke" stroke="white" stroke-width="4">master database</text>
<line x1="1185" y1="190" x2="1225" y2="190" stroke="#b91c1c" stroke-width="1.75" stroke-dasharray="3 3"/>
<line x1="1185" y1="560" x2="1225" y2="560" stroke="#b91c1c" stroke-width="1.75" stroke-dasharray="3 3"/>
<line x1="1225" y1="190" x2="1225" y2="560" stroke="#b91c1c" stroke-width="1.75" stroke-dasharray="3 3"/>
<text x="1237" y="380" font-size="12" font-weight="600" fill="#b91c1c">No link</text>
<rect x="35.0" y="152.0" width="250" height="76" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.25" stroke-dasharray="5 3"/>
<text x="160" y="186" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Registrar's student records</text>
<text x="160" y="202" text-anchor="middle" font-size="11.5" fill="#4b5563">external; sends a spreadsheet</text>
<rect x="495.0" y="152.0" width="250" height="76" rx="8" fill="white" stroke="#6b7280" stroke-width="1.25"/>
<text x="620" y="186" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">A6  Email (Gmail)</text>
<text x="620" y="202" text-anchor="middle" font-size="11.5" fill="#4b5563">lists, notices, changes, capacity</text>
<rect x="935.0" y="152.0" width="250" height="76" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="1060" y="186" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">A4  School pairing lists</text>
<text x="1060" y="202" text-anchor="middle" font-size="11.5" fill="#4b5563">one per coordinator</text>
<rect x="935.0" y="352.0" width="250" height="76" rx="8" fill="white" stroke="#6b7280" stroke-width="1.25"/>
<text x="1060" y="386" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">A5  Retention survey</text>
<text x="1060" y="402" text-anchor="middle" font-size="11.5" fill="#4b5563">Google Forms, per coordinator</text>
<rect x="35.0" y="522.0" width="250" height="76" rx="8" fill="white" stroke="#6b7280" stroke-width="1.25"/>
<text x="160" y="556" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">A1  Session Log Form</text>
<text x="160" y="572" text-anchor="middle" font-size="11.5" fill="#4b5563">Google Forms</text>
<rect x="495.0" y="522.0" width="250" height="76" rx="8" fill="white" stroke="#6b7280" stroke-width="1.25"/>
<text x="620" y="556" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">A2  Confirmation script</text>
<text x="620" y="572" text-anchor="middle" font-size="11.5" fill="#4b5563">Apps Script, by the IT Office</text>
<rect x="935.0" y="522.0" width="250" height="76" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="1060" y="556" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">A3  OSM Google Sheets</text>
<text x="1060" y="572" text-anchor="middle" font-size="11.5" fill="#4b5563">session log and master database</text>
<text x="620" y="140.0" text-anchor="middle" font-size="11.5" font-style="italic" fill="#4b5563">Mentor change requests have no record outside email</text>
<line x1="40" y1="680" x2="80" y2="680" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
<text x="92" y="684" font-size="12" fill="#1f2937">Automated</text>
<line x1="40" y1="702" x2="80" y2="702" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="92" y="706" font-size="12" fill="#1f2937">Manual or by email</text>
<line x1="420" y1="680" x2="460" y2="680" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="472" y="684" font-size="12" fill="#1f2937">Missing link between OSM and the schools' lists</text>
<rect x="420" y="693" width="40" height="18" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-dasharray="5 3"/>
<text x="472" y="706" font-size="12" fill="#1f2937">Outside the unit</text>
</svg>
